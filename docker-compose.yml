services:
  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicore
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: medicore_password
    ports:
      - "55432:5432"
    volumes:
      - medicore_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - medicore_redis_data:/data

volumes:
  medicore_postgres_data:
  medicore_redis_data:
  